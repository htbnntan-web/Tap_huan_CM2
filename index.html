<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return originalFetch;
              },
              set: function (newFetch) {
                if (typeof newFetch === 'function') {
                  originalFetch = newFetch;
                }
              },
            });
          }
        } catch (e) {
          // Ignore if environment disallows redefine
        }

        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              ((event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
                (event.message &&
                  event.message.indexOf('Cannot set property fetch of #<Window>') !== -1))
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
